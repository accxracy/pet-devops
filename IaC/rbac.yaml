apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pet-ci-cluster-role
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["*"]
  - apiGroups: ["admissionregistration.k8s.io", "apiregistration.k8s.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pet-ci-cluster-binding
subjects:
  - kind: ServiceAccount
    name: pet-cluster-gitlab-agent
    namespace: gitlab-agent-pet-cluster
roleRef:
  kind: ClusterRole
  name: pet-ci-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pet-ci-admin-app
  namespace: pet-app
subjects:
  - kind: ServiceAccount
    name: pet-cluster-gitlab-agent
    namespace: gitlab-agent-pet-cluster
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
---
# 3. Полный доступ внутри неймспейса monitoring
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pet-ci-admin-monitoring
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: pet-cluster-gitlab-agent
    namespace: gitlab-agent-pet-cluster
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pet-ci-admin-agent
  namespace: gitlab-agent-pet-cluster
subjects:
  - kind: ServiceAccount
    name: pet-cluster-gitlab-agent
    namespace: gitlab-agent-pet-cluster
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pet-ci-kube-system-role
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pet-ci-kube-system-binding
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: pet-cluster-gitlab-agent
    namespace: gitlab-agent-pet-cluster
roleRef:
  kind: Role
  name: pet-ci-kube-system-role
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pet-ci-prometheus-crd-role
  namespace: monitoring
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pet-ci-prometheus-crd-binding
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: pet-cluster-gitlab-agent
    namespace: gitlab-agent-pet-cluster
roleRef:
  kind: Role
  name: pet-ci-prometheus-crd-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pet-ci-prometheus-crd-app-role
  namespace: pet-app
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pet-ci-prometheus-crd-app-binding
  namespace: pet-app
subjects:
  - kind: ServiceAccount
    name: pet-cluster-gitlab-agent
    namespace: gitlab-agent-pet-cluster
roleRef:
  kind: Role
  name: pet-ci-prometheus-crd-app-role
  apiGroup: rbac.authorization.k8s.io

