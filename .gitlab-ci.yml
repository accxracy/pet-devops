stages:
  - helm-lint
  - build
  - monitoring
  - deploy
  - test

.kube_access:
  image: alpine:3.24
  tags:
    - $BUILD_RUNNER_TAG
  variables:
    KUBECTL_VERSION: "v1.31.2"
    KUBE_CONTEXT: "accxracy/pet-devops:pet-cluster"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache curl ca-certificates 'helm~3.19'
    - |
      set -eu
      BASE="https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64"
      curl -fsSL --retry 3 "$BASE/kubectl" -o /tmp/kubectl
      curl -fsSL --retry 3 "$BASE/kubectl.sha256" -o /tmp/kubectl.sha256
      (
        cd /tmp
        echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
      )
      chmod +x /tmp/kubectl
      mv /tmp/kubectl /usr/local/bin/kubectl
    - kubectl config use-context "$KUBE_CONTEXT"


lint:helm:
  stage: helm-lint
  image: alpine:3.24
  tags:
    - $BUILD_RUNNER_TAG
  before_script:
    - apk add --no-cache 'helm~3.19'
  script:
    - helm lint ./helm/charts/pet-app





image_publish:
  stage: build
  image: docker:29.8.2-cli
  tags:
    - $BUILD_RUNNER_TAG
  services:
    - name: docker:29.8.2-dind
      alias: docker
      command: ["--mtu=1400"]
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build -f Dockerfile -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" ./app
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

prometheus_and_grafana:
  extends: .kube_access
  stage: monitoring
  resource_group: pet-monitoring
  variables:
    KPS_CHART_VERSION: "61.3.2"
  before_script:
    - !reference [.kube_access, before_script]
  script:
    - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
    - helm repo update
    - |
      helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
        --kube-context "$KUBE_CONTEXT" \
        --namespace monitoring \
        --create-namespace \
        --version "$KPS_CHART_VERSION" \
        --values helm/monitoring/values.yaml \
        --set grafana.adminUser="$GRAFANA_ADMIN_USER" \
        --set grafana.adminPassword="$GRAFANA_ADMIN_PASSWORD" \
        --set-string "alertmanager.config.receivers[0].telegram_configs[0].bot_token=${TELEGRAM_BOT_API}" \
        --atomic \
        --timeout 5m
    - kubectl -n monitoring get pods

deploy_dev:
  extends: .kube_access
  stage: deploy
  environment:
    name: dev-kind
    deployment_tier: development
  resource_group: pet-app-dev
  before_script:
    - !reference [.kube_access, before_script]
    - kubectl get nodes
    - kubectl --namespace pet-app get pods
    - helm status pet-app --namespace pet-app || true
  script:
    - |
      helm upgrade pet-app ./helm/charts/pet-app \
        --kube-context "$KUBE_CONTEXT" \
        --namespace pet-app \
        --set-string app.image.repository="$CI_REGISTRY_IMAGE" \
        --set-string app.image.tag="$CI_COMMIT_SHA" \
        --atomic \
        --timeout 5m
    - kubectl --namespace pet-app rollout status deployment/pet-app-app --timeout=120s
    - |
      ACTUAL_IMAGE=$(kubectl --namespace pet-app get deployment pet-app-app \
        -o jsonpath='{.spec.template.spec.containers[0].image}')
      EXPECTED_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      printf 'Deployment image: %s\n' "$ACTUAL_IMAGE"
      test "$ACTUAL_IMAGE" = "$EXPECTED_IMAGE"
    - kubectl --namespace pet-app get deployments,statefulsets,pods
  after_script:
    - |
      if command -v kubectl >/dev/null 2>&1; then
        kubectl config use-context "$KUBE_CONTEXT" >/dev/null 2>&1 || true
        kubectl --namespace pet-app get pods || true
        kubectl --namespace pet-app get events --sort-by=.metadata.creationTimestamp || true
      fi

http_ping:
  extends: .kube_access
  stage: test
  resource_group: pet-app-dev
  script:
    - |
      kubectl -n pet-app run http-smoke \
         --image=curlimages/curl:8.16.0 \
         --restart=Never \
         --rm -i \
         --command -- \
         curl --fail --show-error --silent --max-time 10 \
         -H "Host: pet-app.test" \
         "$SMOKE_URL/healthz/ready"

