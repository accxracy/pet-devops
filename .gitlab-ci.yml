stages:
  - build

check:
  stage: build
  image: docker:latest
  
  services:
    - name: docker:29.8.2-dind
      alias: docker
  
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  

  tags:
    - saas-linux-small-amd64
  script:
    - docker build -f Dockerfile -t pet-app:v1 ./app
    - docker image ls
    
