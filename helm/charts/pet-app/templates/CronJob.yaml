apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-dump
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.backup.schedule }} 
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: pg-dump
              image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
              env:
                - name: PGHOST
                  value: {{ .Release.Name }}-postgres
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: {{ .Values.postgres.database | quote }}
                - name: PGUSER
                  value: {{ .Values.postgres.username | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postgres.existingSecret | quote }}
                      key: password
                - name: PGCONNECT_TIMEOUT
                  value: "10"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  umask 077

                  file="/backups/{{ .Release.Name }}-$(date -u +%Y%m%dT%H%M%SZ)-$(hostname).dump"
                  tmp="${file}.partial"
                  trap 'rm -f "$tmp"' EXIT
                  trap 'exit 1' HUP INT TERM

                  pg_dump \
                    --dbname="$PGDATABASE" \
                    --format=custom \
                    --no-password \
                    --file="$tmp"

                  pg_restore --list "$tmp" >/dev/null
                  mv "$tmp" "$file"
                  echo "Backup created: $file"
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ .Values.backup.existingClaim | quote }}

