controller:
  replicaCount: 1

  ingressClass:
    name: nginx
    create: true
    setAsDefaultIngress: false

  enableCustomResources: false

  service:
    type: ClusterIP
    name: nginx-ingress

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

