grafana:
  persistence:
    type: pvc
    storageClassName: standart
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard


prometheus:
  prometheusSpec:
    retention: 7d
    scrapeInterval: 30s

alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1

  config:
    route:
      receiver: telegram
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes: []  

    receivers:
      - name: telegram
        telegram_configs:
          - chat_id: 1095106768
            send_resolved: true

      - name: 'null'