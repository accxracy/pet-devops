grafana:
  persistence:
    type: pvc
    storageClassName: standart
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard


prometheus:
  prometheusSpec:
    retention: 7d
    scrapeInterval: 30s
